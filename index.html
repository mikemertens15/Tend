<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4ece1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tend" />
    <meta name="description" content="Tend — chores, meals, groceries, pets, vehicles and everything else that keeps a household running." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Tend</title>
    <script>
      // Pick the skin before first paint, so the app never flashes the wrong
      // one. Mirrors src/useTheme.js: a stored palette and mode win, and mode
      // 'system' (the default) follows the OS.
      (function () {
        var palette = 'warm';
        var mode = 'light';
        try {
          var p = localStorage.getItem('tend.palette');
          if (['warm', 'calm', 'garden', 'dusk'].indexOf(p) >= 0) palette = p;
          var m = localStorage.getItem('tend.mode') || 'system';
          mode =
            m === 'light' || m === 'dark'
              ? m
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
        } catch (e) {
          /* no localStorage (private mode) — stay with the defaults */
        }
        var root = document.documentElement;
        root.dataset.palette = palette;
        root.dataset.mode = mode;
        // Status bar tint. The stylesheet may not have loaded this early, so
        // fall back to a small map; useTheme re-reads the real value from the
        // stylesheet once React mounts and corrects any drift.
        var BG = {
          'warm-light': '#f4ece1', 'warm-dark': '#17120f',
          'calm-light': '#f4f6f8', 'calm-dark': '#11151a',
          'garden-light': '#f1f4ed', 'garden-dark': '#12160f',
          'dusk-light': '#f4f2f8', 'dusk-dark': '#15121b',
        };
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          var fromCss = getComputedStyle(root).getPropertyValue('--c-bg').trim();
          meta.setAttribute('content', fromCss || BG[palette + '-' + mode] || '#f4ece1');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
